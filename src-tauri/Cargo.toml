[package]
name = "promptpad"
version = "0.0.5"
description = "Markdown editor for maintaining agentic prompts"
edition = "2021"
license = "MIT"
repository = "https://github.com/jthunderbird/promptpad"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
